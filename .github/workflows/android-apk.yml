name: Build NOVA Messenger Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mobile/**"
      - "android-app/**"
      - "scripts/prepare-mobile.cjs"
      - "scripts/patch-android-manifest.cjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nova-messenger-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android wrapper dependencies
        working-directory: android-app
        run: npm install

      - name: Package the complete mobile UI
        run: node scripts/prepare-mobile.cjs

      - name: Generate native Android project
        working-directory: android-app
        run: npx cap add android

      - name: Sync app assets and plugins
        working-directory: android-app
        run: npx cap sync android

      - name: Add Android microphone and camera permissions
        run: node scripts/patch-android-manifest.cjs

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Messenger-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
