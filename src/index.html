
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>✦ NOVA</h1>
    <p class="subtitle">Твій простір для спілкування</p>

    <button class="nav active" id="chatsTab">💬 Повідомлення</button>
    <button class="nav" id="friendsTab">👥 Друзі</button>

    <div class="profile">
      <div class="avatar">N</div>
      <div>
        <strong id="username">Гість</strong>
        <small id="status">NOVA Messenger</small>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h2 id="pageTitle">Повідомлення</h2>
      <span class="online">● NOVA</span>
    </header>

    <section id="content">
      <div class="welcome">
        <div class="welcome-icon">✦</div>
        <h2>Ласкаво просимо до NOVA</h2>
        <p>Твій новий простір для спілкування.</p>
        <p>Незабаром тут з'являться твої чати та друзі.</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
