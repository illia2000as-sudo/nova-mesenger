<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10111c">
  <meta name="description" content="NOVA Messenger — чаты, друзья, группы и звонки в твоём телефоне.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NOVA Messenger Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./nova-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/style.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <noscript><p style="padding:24px;color:white">Для работы NOVA включи JavaScript в браузере.</p></noscript>
  <script type="module" src="../src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
